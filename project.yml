name: Passages
options:
  bundleIdPrefix: com.passages
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Passages:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Passages
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passages.app
        PRODUCT_NAME: Passages
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Passages/Info.plist
      properties:
        CFBundleDisplayName: Passages
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Ta position sert à trouver les arrêts de bus, tram, métro et RER autour de toi."
        ITSAppUsesNonExemptEncryption: false
